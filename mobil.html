<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Gun Arena Mobile</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070912;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #171b25;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

/* HUD */

#hud {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-size: 15px;
    font-weight: bold;

    pointer-events: none;
    z-index: 3;
}

.health {
    color: #ff4141;
}

.ammo {
    color: #ffd21c;
}

/* MENU */

#menu,
#gameOver {
    position: absolute;
    inset: 0;

    background: rgba(4, 6, 13, .94);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    z-index: 20;

    padding: 20px;
}

#gameOver {
    display: none;
}

h1 {
    color: #ffcc00;
    font-size: clamp(38px, 11vw, 65px);
    margin: 0 0 10px;
    text-shadow: 0 0 20px #ff9900;
}

p {
    color: #ccc;
    font-size: 17px;
}

button {
    border: 0;
    border-radius: 14px;

    padding: 16px 35px;

    background: #ffcc00;
    color: #111;

    font-size: 20px;
    font-weight: bold;

    margin-top: 15px;
}

/* MOBILE CONTROLS */

#controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

/* JOYSTICK */

#joystick {
    position: absolute;

    left: 25px;
    bottom: 30px;

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.25);

    pointer-events: auto;
}

#stick {
    position: absolute;

    left: 37px;
    top: 37px;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: rgba(255,204,0,.8);

    box-shadow: 0 0 15px #ffcc00;
}

/* SHOOT */

#shoot {
    position: absolute;

    right: 25px;
    bottom: 35px;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: rgba(255,70,50,.35);
    border: 3px solid #ff5544;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;

    pointer-events: auto;
}

/* RELOAD */

#reload {
    position: absolute;

    right: 35px;
    bottom: 150px;

    width: 70px;
    height: 45px;

    border-radius: 12px;

    background: rgba(255,204,0,.75);

    color: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    pointer-events: auto;
}

/* Small phones */

@media (max-width: 400px) {

    #joystick {
        width: 105px;
        height: 105px;
        left: 18px;
        bottom: 20px;
    }

    #stick {
        left: 30px;
        top: 30px;
    }

    #shoot {
        width: 85px;
        height: 85px;
        right: 18px;
        bottom: 25px;
    }

    #reload {
        right: 25px;
        bottom: 125px;
    }

}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

    <div>
        ❤️ <span class="health" id="health">100</span>
    </div>

    <div>
        🏆 <span id="score">0</span>
    </div>

    <div>
        🔫 <span class="ammo" id="ammo">12</span>/12
    </div>

    <div>
        🌊 <span id="wave">1</span>
    </div>

</div>


<!-- START MENU -->

<div id="menu">

    <h1>🔫 GUN ARENA</h1>

    <p>
        Survive the enemy waves!
    </p>

    <p>
        🎮 Mobile Edition
    </p>

    <button onclick="startGame()">
        START GAME
    </button>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <h1>💥 GAME OVER</h1>

    <p>
        Score:
        <strong id="finalScore">0</strong>
    </p>

    <p>
        Wave:
        <strong id="finalWave">1</strong>
    </p>

    <button onclick="startGame()">
        PLAY AGAIN
    </button>

</div>


<!-- MOBILE CONTROLS -->

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="reload">
        RELOAD
    </div>

    <div id="shoot">
        🔫
    </div>

</div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W;
let H;

function resize() {

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


// -------------------------
// GAME VARIABLES
// -------------------------

let player;

let bullets = [];
let enemies = [];
let particles = [];

let score = 0;
let health = 100;
let ammo = 12;
let wave = 1;

let running = false;

let spawnTimer = 0;
let shootCooldown = 0;
let reloadTimer = 0;


// -------------------------
// MOBILE INPUT
// -------------------------

let joystick = {
    active: false,
    x: 0,
    y: 0
};

let shooting = false;


// -------------------------
// PLAYER
// -------------------------

function createPlayer() {

    player = {

        x: W / 2,
        y: H / 2,

        radius: 20,

        speed: 4,

        angle: 0

    };

}


// -------------------------
// JOYSTICK
// -------------------------

const joystickElement =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


joystickElement.addEventListener(
    "touchstart",
    joystickStart,
    {passive:false}
);

joystickElement.addEventListener(
    "touchmove",
    joystickMove,
    {passive:false}
);

joystickElement.addEventListener(
    "touchend",
    joystickEnd,
    {passive:false}
);


function joystickStart(e) {

    e.preventDefault();

    joystick.active = true;

    joystickMove(e);

}


function joystickMove(e) {

    if (!joystick.active) return;

    e.preventDefault();

    const touch =
        e.touches[0];

    const rect =
        joystickElement.getBoundingClientRect();

    let x =
        touch.clientX -
        (rect.left + rect.width / 2);

    let y =
        touch.clientY -
        (rect.top + rect.height / 2);

    const max =
        rect.width / 2 - 25;

    const distance =
        Math.sqrt(x*x + y*y);

    if (distance > max) {

        x =
            x / distance * max;

        y =
            y / distance * max;

    }

    joystick.x =
        x / max;

    joystick.y =
        y / max;

    stick.style.transform =
        `translate(${x}px, ${y}px)`;

}


function joystickEnd(e) {

    e.preventDefault();

    joystick.active = false;

    joystick.x = 0;
    joystick.y = 0;

    stick.style.transform =
        "translate(0,0)";

}


// -------------------------
// SHOOT BUTTON
// -------------------------

const shootButton =
    document.getElementById("shoot");


shootButton.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        shooting = true;

    },
    {passive:false}
);


shootButton.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        shooting = false;

    },
    {passive:false}
);


// -------------------------
// RELOAD BUTTON
// -------------------------

document
.getElementById("reload")
.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        reload();

    },
    {passive:false}
);


// -------------------------
// SHOOT
// -------------------------

function shoot() {

    if (!running) return;

    if (reloadTimer > 0) return;

    if (shootCooldown > 0) return;

    if (ammo <= 0) {

        reload();

        return;

    }

    let angle =
        player.angle;

    bullets.push({

        x:
            player.x +
            Math.cos(angle) * 30,

        y:
            player.y +
            Math.sin(angle) * 30,

        vx:
            Math.cos(angle) * 11,

        vy:
            Math.sin(angle) * 11,

        life: 70

    });

    ammo--;

    shootCooldown = 10;

    updateHUD();

}


// -------------------------
// RELOAD
// -------------------------

function reload() {

    if (reloadTimer > 0) return;

    if (ammo === 12) return;

    reloadTimer = 50;

}


// -------------------------
// ENEMIES
// -------------------------

function createEnemy() {

    let side =
        Math.floor(
            Math.random() * 4
        );

    let x;
    let y;

    if (side === 0) {
        x = -30;
        y = Math.random() * H;
    }

    if (side === 1) {
        x = W + 30;
        y = Math.random() * H;
    }

    if (side === 2) {
        x = Math.random() * W;
        y = -30;
    }

    if (side === 3) {
        x = Math.random() * W;
        y = H + 30;
    }

    enemies.push({

        x,
        y,

        radius: 18,

        speed:
            1 +
            Math.random() * .8 +
            wave * .05,

        hp: 30

    });

}


// -------------------------
// EXPLOSION
// -------------------------

function explosion(x,y) {

    for (let i=0; i<18; i++) {

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*7,

            vy:
                (Math.random()-.5)*7,

            life: 25

        });

    }

}


function updateParticles() {

    for (
        let i=particles.length-1;
        i>=0;
        i--
    ) {

        let p =
            particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i,1);

        }

    }

}


function drawParticles() {

    for (let p of particles) {

        ctx.globalAlpha =
            p.life / 25;

        ctx.fillStyle =
            "#ff9d00";

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha = 1;

}


// -------------------------
// PLAYER DRAW
// -------------------------

function drawPlayer() {

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(
        player.angle
    );

    // Body

    ctx.fillStyle =
        "#42a5f5";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Gun

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        10,
        -5,
        35,
        10
    );


    // Face

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        8,
        -7,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

}


// -------------------------
// ENEMY DRAW
// -------------------------

function drawEnemy(enemy) {

    ctx.fillStyle =
        "#e53935";

    ctx.shadowColor =
        "#ff0000";

    ctx.shadowBlur = 12;

    ctx.beginPath();

    ctx.arc(
        enemy.x,
        enemy.y,
        enemy.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        enemy.x - 6,
        enemy.y - 4,
        4,
        0,
        Math.PI * 2
    );

    ctx.arc(
        enemy.x + 6,
        enemy.y - 4,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// -------------------------
// BULLETS
// -------------------------

function updateBullets() {

    for (
        let i=bullets.length-1;
        i>=0;
        i--
    ) {

        let b =
            bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;

        if (
            b.life <= 0 ||
            b.x < -20 ||
            b.x > W+20 ||
            b.y < -20 ||
            b.y > H+20
        ) {

            bullets.splice(i,1);

        }

    }

}


function drawBullets() {

    ctx.fillStyle =
        "#ffe600";

    ctx.shadowColor =
        "#ff9900";

    ctx.shadowBlur = 10;

    for (let b of bullets) {

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.shadowBlur = 0;

}


// -------------------------
// PLAYER UPDATE
// -------------------------

function updatePlayer() {

    player.x +=
        joystick.x *
        player.speed;

    player.y +=
        joystick.y *
        player.speed;


    player.x =
        Math.max(
            25,
            Math.min(
                W-25,
                player.x
            )
        );

    player.y =
        Math.max(
            60,
            Math.min(
                H-30,
                player.y
            )
        );


    // Automatically aim at nearest enemy

    let nearest = null;
    let nearestDistance = Infinity;

    for (let enemy of enemies) {

        let dx =
            enemy.x -
            player.x;

        let dy =
            enemy.y -
            player.y;

        let d =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        if (d < nearestDistance) {

            nearestDistance = d;

            nearest = enemy;

        }

    }


    if (nearest) {

        player.angle =
            Math.atan2(
                nearest.y-player.y,
                nearest.x-player.x
            );

    }

}


// -------------------------
// ENEMY UPDATE
// -------------------------

function updateEnemies() {

    spawnTimer--;

    if (spawnTimer <= 0) {

        createEnemy();

        spawnTimer =
            Math.max(
                18,
                65 - wave * 4
            );

    }


    for (
        let i=enemies.length-1;
        i>=0;
        i--
    ) {

        let enemy =
            enemies[i];

        let dx =
            player.x -
            enemy.x;

        let dy =
            player.y -
            enemy.y;

        let distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        enemy.x +=
            dx / distance *
            enemy.speed;

        enemy.y +=
            dy / distance *
            enemy.speed;


        // Hit player

        if (distance < 35) {

            health -= 10;

            explosion(
                enemy.x,
                enemy.y
            );

            enemies.splice(i,1);

            updateHUD();

            if (health <= 0) {

                gameOver();

                return;

            }

        }


        // Bullet hit

        for (
            let j=bullets.length-1;
            j>=0;
            j--
        ) {

            let b =
                bullets[j];

            let bx =
                b.x -
                enemy.x;

            let by =
                b.y -
                enemy.y;

            let d =
                Math.sqrt(
                    bx*bx +
                    by*by
                );


            if (
                d <
                enemy.radius + 5
            ) {

                enemy.hp -= 15;

                bullets.splice(j,1);

                explosion(
                    b.x,
                    b.y
                );


                if (enemy.hp <= 0) {

                    score += 10;

                    explosion(
                        enemy.x,
                        enemy.y
                    );

                    enemies.splice(i,1);

                    wave =
                        Math.floor(
                            score / 100
                        ) + 1;

                    updateHUD();

                }

                break;

            }

        }

    }

}


// -------------------------
// HUD
// -------------------------

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(0,health);

    document.getElementById(
        "ammo"
    ).textContent =
        ammo;

    document.getElementById(
        "score"
    ).textContent =
        score;

    document.getElementById(
        "wave"
    ).textContent =
        wave;

}


// -------------------------
// DRAW
// -------------------------

function drawBackground() {

    ctx.fillStyle =
        "#171b25";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // Arena grid

    ctx.strokeStyle =
        "#ffffff09";

    for (
        let x=0;
        x<W;
        x+=50
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }

    for (
        let y=0;
        y<H;
        y+=50
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }

}


function draw() {

    drawBackground();

    drawBullets();

    for (let enemy of enemies) {

        drawEnemy(enemy);

    }

    drawParticles();

    drawPlayer();

}


// -------------------------
// GAME LOOP
// -------------------------

function gameLoop() {

    if (!running) return;

    updatePlayer();

    if (shooting) {
        shoot();
    }

    if (shootCooldown > 0) {
        shootCooldown--;
    }


    if (reloadTimer > 0) {

        reloadTimer--;

        if (reloadTimer === 0) {

            ammo = 12;

            updateHUD();

        }

    }


    updateBullets();

    updateEnemies();

    updateParticles();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


// -------------------------
// START
// -------------------------

function startGame() {

    score = 0;
    health = 100;
    ammo = 12;
    wave = 1;

    bullets = [];
    enemies = [];
    particles = [];

    spawnTimer = 0;
    shootCooldown = 0;
    reloadTimer = 0;

    createPlayer();

    updateHUD();

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "gameOver"
    ).style.display = "none";

    running = true;

    gameLoop();

}


// -------------------------
// GAME OVER
// -------------------------

function gameOver() {

    running = false;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalWave"
    ).textContent =
        wave;

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

}

</script>

</body>
</html>
